name: Deploy

# Deploys the site to Cloudflare Workers whenever CI passes on a push to main.
# Run it by hand (Actions → Deploy → Run workflow) to redeploy main.
# One-time setup is in README.md under "Deploying the site".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Only a green CI run for a push to main; never a PR run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Holds the Cloudflare secrets; limited to main in the repo settings.
    environment:
      name: production
      url: https://edityy.webdesignbyft.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact commit CI just passed, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No cache in a job that holds a deploy token: a poisoned cache could read it.
          package-manager-cache: false

      - name: Check the Cloudflare secrets are set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the production environment. See README.md, Deploying the site."
              missing=1
            fi
          done
          exit $missing

      - run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx vinext-cloudflare deploy

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://edityy.webdesignbyft.workers.dev/)
            [ "$code" = "200" ] && { echo "live: 200"; exit 0; }
            echo "attempt $i: $code"; sleep 10
          done
          echo "::error::Site did not return 200 after deploy."
          exit 1
